
rules:
  - id: pizza-mya-logging-sensitive-data
    languages:
      - typescript
      - javascript
    severity: WARNING
    message: >
      Posible exposición de información sensible
      mediante registros de consola.
      Revisar que no se impriman tokens o contraseñas.
    patterns:
      - pattern: console.$METHOD(..., $DATA, ...)
      - metavariable-regex:
          metavariable: $DATA
          regex: (?i).*(token|password|contrasena|contraseña|secret|jwt).*
    metadata:
      category: security
      project: pizza-mya-movil
      technology:
        - react-native
        - expo
``