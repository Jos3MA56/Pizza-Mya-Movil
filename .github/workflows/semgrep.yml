name: Semgrep - Analisis SAST

on:
  push:
    branches:
      - feature/analisis-seguridad-sast-dast

  pull_request:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Analisis de seguridad
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    steps:
      - name: Obtener codigo del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar reglas generales de seguridad
        run: |
          semgrep scan \
            --config p/security-audit \
            --json \
            --output semgrep-general.json \
            src/

      - name: Ejecutar reglas personalizadas
        if: always()
        run: |
          semgrep scan \
            --config .semgrep/semgrep.yml \
            --json \
            --output semgrep-personalizado.json \
            src/

      - name: Guardar reportes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-semgrep
          path: |
            semgrep-general.json
            semgrep-personalizado.json
          if-no-files-found: warn
          retention-days: 30
